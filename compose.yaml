services:
  postgres:
    image: postgres:16-alpine
    container_name: funkoapp-postgres
    environment:
      POSTGRES_DB: funkos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d funkos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: funkoapp-redis
    ports:
      - "6390:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass redis123
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7.0
    container_name: funkoapp-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  funkoappi01:
    image: funkoappi01
    build:
      context: .
      dockerfile: FunkoAppi01/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DatabaseSettings__ConnectionString=Host=postgres;Port=5432;Database=funkos;Username=postgres;Password=postgres
      - Redis__ConnectionString=redis:6379,password=redis123
      - Mongo__ConnectionString=mongodb://mongo:27017
      - DatabaseSettings__CategoriaProvider=${DATABASESETTINGS__CATEGORIAPROVIDER:-EFCore}

volumes:
  postgres_data:
  redis_data:
  mongo_data:
