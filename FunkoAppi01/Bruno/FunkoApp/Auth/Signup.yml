info:
  name: Signup
  type: http
  seq: 2

http:
  method: POST
  url: "{{url}}/auth/signup"
  body:
    type: json
    data: |-
      {
        "username": "{{$randomUserName}}",
        "email": "{{$randomEmail}}",
        "password": "Password123!"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
