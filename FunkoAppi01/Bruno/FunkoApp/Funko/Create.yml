info:
  name: Create
  type: http
  seq: 5

http:
  method: POST
  url: "{{url}}/Funko"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"
      enabled: true
  body:
    type: json
    data: |-
      {
        "nombre": "{{$randomNoun}}",
        "precio": {{$randomPrice}},
        "stock": 10,
        "categoria": "Pokemon"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
