info:
  name: Update
  type: http
  seq: 6

http:
  method: PUT
  url: "{{url}}/Funko/1"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"
      enabled: true
  body:
    type: json
    data: |-
      {
        "nombre": "{{$randomNoun}}",
        "precio": {{$randomPrice}},
        "stock": 5,
        "categoria": "Pokemon"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
